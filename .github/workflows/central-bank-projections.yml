name: Projections des banques centrales

on:
  workflow_dispatch: {}       # bouton "Run workflow" manuel dans l'onglet Actions
  schedule:
    - cron: "0 6 1 * *"       # tous les 1er du mois à 6h UTC (couvre large, les scripts filtrent eux-mêmes les rapports déjà publiés)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 openpyxl

      - name: Fed — Summary of Economic Projections
        continue-on-error: true
        run: python scripts/fed_sep_scraper.py --out data/fed/fed_sep.json

      - name: Banque du Canada — Rapport sur la politique monétaire
        continue-on-error: true
        run: python scripts/boc_mpr_scraper.py --out data/boc/boc_mpr.json

      - name: BCE — Projections macroéconomiques
        continue-on-error: true
        run: python scripts/ecb_projections_scraper.py --out data/ecb/ecb_projections.json

      - name: Banque d'Angleterre — Monetary Policy Report
        continue-on-error: true
        run: python scripts/boe_mpr_scraper.py --out data/boe/boe_mpr.json

      - name: Récupérer les fichiers de diagnostic (si échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: debug_*.html
          if-no-files-found: ignore

      - name: Committer et pousser les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "Mise à jour des projections des banques centrales ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
